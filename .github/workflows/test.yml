name: Test

on:
  push:
  pull_request:

jobs:
  replay-and-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test replay and data splits
        run: python -m pytest -q
      - name: Generate research data
        run: python -m nke_experiment.data --scenarios 100 --output data/generated
