[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nke-experiment"
version = "0.0.1"
description = "NKE research scaffold: event replay, decision data, and trainable snapshot model"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
model = ["torch>=2.2", "transformers>=4.48", "safetensors>=0.4"]
dev = ["pytest>=8"]

[project.scripts]
nke-data = "nke_experiment.data:main"

[tool.setuptools.packages.find]
where = ["src"]
